repos:
  - repo: local
    hooks:
      - id: live-check
        name: Run Destiny OS Live-Check
        entry: python tools/live_check.py
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        args: [--line-length=100]
        files: ^(tests|tools)/

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile=black]
        files: ^(tests|tools)/
